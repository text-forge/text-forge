name: Sync README to organization profile

on:
  workflow_dispatch:
  push:
    branches:
      - Main
    paths:
      - 'README.md'
      - '.github/workflows/org-profile.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: text-forge/.github
          token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          path: config-repo
      - name: Sync profile to org repo
        run: |
          rm -rf config-repo/profile/*
          mkdir -p config-repo/profile/docs/img
          cp README.md config-repo/profile/README.md
          cp -r docs/img config-repo/profile/docs
          cd config-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update profile README"
          git push
