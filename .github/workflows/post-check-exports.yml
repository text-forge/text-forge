name: Download and Run Text Forge Exports

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check (e.g. v0.3.0-stable)
        required: true

permissions:
  contents: read
jobs:
  run-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Download archive
        run: |
          curl -L -o linux.zip https://github.com/text-forge/text-forge/releases/download/${{ inputs.tag }}/TextForge-Linux-${{ inputs.tag }}.zip

      - name: Extract archive
        run: |
          unzip linux.zip -d tf-linux

      - name: Change permissions
        run: |
          chmod +x "tf-linux/TextForge/TextForge.sh"
          chmod +x "tf-linux/TextForge/TextForge.x86_64"
      - name: Run Text Forge
        # Closes editor after 5s, check logs for test
        run: |
          timeout -k 1s 5s ./"tf-linux/TextForge/TextForge.sh" --headless || true
  run-windows:
    runs-on: windows-latest
    steps:
      - name: Download archive
        run: |
          Invoke-WebRequest -Uri https://github.com/text-forge/text-forge/releases/download/${{ inputs.tag }}/TextForge-Windows-${{ inputs.tag }}.zip -OutFile windows.zip

      - name: Extract archive
        run: |
          Expand-Archive -Path windows.zip -DestinationPath tf-windows

      - name: Run Text Forge (5s timeout with logs)
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "tf-windows/TextForge/TextForge.exe" -ArgumentList "--headless" -PassThru -NoNewWindow -RedirectStandardOutput stdout.log -RedirectStandardError stderr.log
          Start-Sleep -Seconds 5
          Stop-Process -Id $process.Id -Force
          Get-Content stdout.log
          Get-Content stderr.log
